name: P0 candidate checks
on:
  push:
    branches:
      - experiment/p0-reusable-feature-onboarding-20261026
  workflow_dispatch:
jobs:
  go:
    name: Go tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: processor/go.mod
      - name: Format candidate before validation
        run: gofmt -w p0identity.go p0installer.go p0routes.go p0_test.go
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -o p0-processor${{ runner.os == 'Windows' && '.exe' || '' }} .
