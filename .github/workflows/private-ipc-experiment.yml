name: Processor private IPC experiment checks
on:
  push:
    branches:
      - experiment/backend-isolated-identity-test-20261027
  pull_request:
    branches: [alpha]
permissions:
  contents: read
jobs:
  go-and-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: processor/go.mod
      - name: Run Go tests
        run: go test ./...
      - name: Validate private pipe integration test syntax
        run: python3 -m py_compile acceptance/p0_integration.py
