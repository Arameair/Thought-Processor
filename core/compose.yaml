# TASS as ONE Docker application: Identity, Thought Engine (with the 20-second work pulse),
# Thought-Processor core, and one local model (llama.cpp). One project, one start, one update.
#
# Don't run this file by hand: ./tass.sh start sets the pinned images, folders, keys and model.
#
#   identity  tass-identity (Go): creates THIS installation's own entity, owner unlock, and
#             authorizes every action. Its page is on 127.0.0.1:8796 only. Nothing is built in:
#             a fresh install has NO entity until its owner creates one, and stays LOCKED after
#             every restart until its owner unlocks it.
#   model     llama.cpp server with weights from your MODEL_DIR (never in an image or in Git).
#             Only on the internal network: nothing outside the application can reach it, and it
#             has no internet. Profile "bundled-model"; with MODEL_MODE=external the app uses a
#             model that is already running instead, so a computer never runs two.
#   engine    Thought Engine (Go): Spark/Trace/Thought, thought cycles, the 20-s coordination pulse.
#             Listens ONLY on 127.0.0.1 inside its own network namespace.
#   core      tass-core (Go): the page you talk on, tasks, pulse controls. Shares the engine's
#             network namespace; its page is published on 127.0.0.1:8795 only.
#
# Secrets (service keys, the engine key) are generated at install into $APP_HOME/secrets and
# mounted read-only. Images contain no keys, credentials, memories or personal files.
name: ${APP_PROJECT:-tass-app}
services:
  identity:
    image: ${IDENTITY_IMAGE:?use ./tass.sh start}
    user: "${APP_UID:?}:${APP_GID:?}"
    environment:
      HOME: /tmp
      IDENTITY_DATA: /data/identity
      IDENTITY_LISTEN: 0.0.0.0:8796
      IDENTITY_SERVICE_KEYS: /run/tass-secrets/service-keys
      IDENTITY_UNLOCK_HOURS: ${IDENTITY_UNLOCK_HOURS:-12}
    volumes:
      - ${APP_DATA:?}/identity:/data/identity                  # entity.json, credential, decisions.jsonl
      - ${APP_SECRETS:?}/service-keys:/run/tass-secrets/service-keys:ro
    networks: [front, app]
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8796}:8796"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/tass-identity", "-healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  model:
    profiles: [bundled-model]
    image: ${MODEL_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    command: ${MODEL_ARGS:?use ./tass.sh start}
    environment:
      FIXTURE_DELAY: ${FIXTURE_DELAY:-}                         # test fixture only; ignored by llama.cpp
    volumes:
      - ${MODEL_DIR:-/nonexistent}:/models:ro                   # your weights, read-only
    networks: [app]                                             # internal only: no ports, no internet
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "${MODEL_HEALTH_CMD:-curl -sf http://127.0.0.1:8081/health}"]
      interval: 10s
      timeout: 6s
      retries: 60                                               # loading a large model takes a while
      start_period: 30s
    restart: unless-stopped

  engine:
    image: ${ENGINE_IMAGE:?use ./tass.sh start}
    user: "${APP_UID:?}:${APP_GID:?}"
    command: ["-data", "/data/engine", "-model", "${MODEL_URL:-http://model:8081}", "-worker", "nemotron",
              "-identity-url", "http://identity:8796", "-identity-key-file", "/run/tass-secrets/engine.key",
              "-pulse", "${PULSE_EVERY:-20s}"]
    environment:
      PORT: "7798"
      HOME: /tmp
    volumes:
      - ${APP_DATA:?}/engine:/data/engine                      # cycles, jobs, pulse ticks, model requests, api-key
      - ${APP_SECRETS:?}/engine.key:/run/tass-secrets/engine.key:ro
    networks: [front, app]
    ports:
      - "127.0.0.1:${CORE_PORT:-8795}:8795"                     # the core's page (the core shares this namespace)
    depends_on:
      identity:
        condition: service_healthy
      model:
        condition: service_healthy
        required: false                                         # absent with MODEL_MODE=external
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/thought-engine", "-healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  core:
    image: ${CORE_IMAGE:?use ./tass.sh start}
    user: "${APP_UID:?}:${APP_GID:?}"
    network_mode: "service:engine"
    depends_on:
      engine:
        condition: service_healthy
    environment:
      HOME: /tmp
      TASS_DATA: /data/core
      TASS_LISTEN: 0.0.0.0:8795
      TASS_ENGINE_URL: http://127.0.0.1:7798
      TASS_ENGINE_KEY: /run/tass-secrets/engine-api-key
      TASS_IDENTITY_URL: http://identity:8796
      TASS_IDENTITY_KEY_FILE: /run/tass-secrets/core.key
      TASS_REPO: ${GITHUB_REPO:-}                               # empty = local only; nothing is built in
      TASS_BRANCH: ${GITHUB_BRANCH:-live}
      TASS_DOC: ${GITHUB_DOC:-tass.md}
      TASS_LESSONS: ${GITHUB_LESSONS:-lessons}
      TASS_TOKEN_FILE: /run/tass-secrets/github_token
      TASS_GITHUB_API: ${TASS_GITHUB_API:-}                     # tests only; empty = https://api.github.com
    volumes:
      - ${APP_DATA:?}/core:/data/core                          # this entity's document, conversation, memory journal
      - ${APP_DATA:?}/engine/api-key:/run/tass-secrets/engine-api-key:ro
      - ${APP_SECRETS:?}/core.key:/run/tass-secrets/core.key:ro
      - ${APP_SECRETS:?}/github_token:/run/tass-secrets/github_token:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/tass-core", "-healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  front: {}                 # only for the two 127.0.0.1 pages
  app:
    internal: true          # identity ⇄ engine/core ⇄ model; no internet, nothing published
