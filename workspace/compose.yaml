# Thought Processor workspace — the full circle in Docker:
#   model      Nemotron 3 Nano 4B (llama.cpp)                      — thinks
#   liaison    identity-liaison (holds the GitHub token)            — Identity's piece: GitHub access,
#              mirrors Developmnt mind/ + library/, runs instructions + side chat
#   workspace  Thought Processor workspace                          — talk to TASS, watch it think,
#              shared folder + JupyterLab + shared kernel
#
#   ./run.sh                     (recommended: checks setup, then starts)
# No NVIDIA GPU?  ./run.sh --cpu
services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    init: true
    command:
      - --model
      - /models/${TASS_MODEL_FILE:-NVIDIA-Nemotron3-Nano-4B-Q4_K_M.gguf}
      - --alias
      - nemotron-3-nano-4b
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "${TASS_CTX:-16384}"
      - --parallel
      - "1"
      - --jinja
      - --reasoning-format
      - deepseek
      - --gpu-layers
      - "${TASS_GPU_LAYERS:-99}"
    volumes:
      - type: bind
        source: ${TASS_MODEL_DIR:-./models}
        target: /models
        read_only: true
    ports:
      - "127.0.0.1:18083:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  liaison:
    build:
      context: https://github.com/Arameair/identity.git#${LIAISON_REF:-experiment/tass-grows-20261103}:liaison
      args:
        BASE: ${LIAISON_BASE:-python:3.12-alpine}
    image: identity-liaison:workspace
    init: true
    depends_on:
      model:
        condition: service_healthy
    environment:
      IDENTITY_LIAISON_MODEL_URL: http://model:8081
      IDENTITY_LIAISON_MODE: pr
      IDENTITY_LIAISON_REPOS: ${LIAISON_REPOS:-Arameair/identity,Arameair/nemotronTASS,Arameair/Developmnt}
      IDENTITY_LIAISON_CHAT_REPOS: ${LIAISON_CHAT_REPOS:-Arameair/Developmnt}
      IDENTITY_LIAISON_CHAT_PULSE: "30"
      IDENTITY_LIAISON_OWNERS: ${LIAISON_OWNERS:-Arameair}
      # Mirror TASS's mind (his own repo, listed first) and the team's library + projects into ./mirror.
      IDENTITY_LIAISON_SYNC_SOURCES: ${TASS_SOURCES:-Arameair/TASS@alpha:mind/*.md;Arameair/Developmnt:library/*,projects/*}
      IDENTITY_LIAISON_SYNC_DEST: /shared/mirror
      # Mind changes TASS proposes and the owner approves in the workspace become pull requests here.
      IDENTITY_LIAISON_OUTBOX: /shared/outbox
      IDENTITY_LIAISON_WRITE_ALLOW: ${TASS_MIND_WRITE:-Arameair/TASS@*:mind/*.md}
      # Direct TASS from GitHub: issues labelled "tass" here go to the running TASS; replies come back.
      IDENTITY_LIAISON_DIRECT_REPOS: ${TASS_DIRECT_REPOS:-Arameair/TASS}
      IDENTITY_LIAISON_INBOX: /shared/inbox
    user: "${TASS_UID:-1000}:${TASS_GID:-1000}"
    volumes:
      - ./secrets/github_token:/run/secrets/github_token:ro   # only this container gets the token
      - ./config:/config
      - ./mirror:/shared/mirror
      - ./outbox:/shared/outbox                               # owner-approved requests from the workspace
      - ./inbox:/shared/inbox                                 # messages from GitHub for TASS
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  workspace:
    build:
      context: .
      args:
        BASE: ${WORKSPACE_BASE:-python:3.12-slim}
        PIP_FLAGS: ${WORKSPACE_PIP_FLAGS:-}
    image: tass-workspace:local
    init: true
    healthcheck:
      # Healthy only when the page really answers (not just "the container started").
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/status', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s
    depends_on:
      model:
        condition: service_healthy
    environment:
      TASS_MODEL_URL: http://model:8081
      TASS_JUPYTER_PUBLIC: http://127.0.0.1:${TASS_JUPYTER_PORT:-8888}
      TASS_THINKING: ${TASS_THINKING:-1}
      TASS_AUTO_REFLECT: ${TASS_AUTO_REFLECT:-1}
      TASS_MAX_TOKENS: ${TASS_MAX_TOKENS:-4096}
    user: "${TASS_UID:-1000}:${TASS_GID:-1000}"
    volumes:
      - ./shared:/workspace/shared       # your shared space with TASS (also visible from WSL)
      - ./data:/workspace/data           # conversation history, Jupyter settings
      - ./mirror:/shared/mirror:ro       # mind + library + projects, written only by the liaison
      - ./outbox:/shared/outbox          # approved mind changes and GitHub replies go out here
      - ./inbox:/shared/inbox            # messages you send TASS from GitHub arrive here
    ports:
      - "127.0.0.1:${TASS_PORT:-8790}:8790"
      - "127.0.0.1:${TASS_JUPYTER_PORT:-8888}:8888"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  
  # Optional companion playground on a SEPARATE origin, with a restricted chat-only bridge.
  # No GitHub token, Jupyter access or /api/proposal proxy is mounted in Atrium.
  atrium:
    build:
      context: ./atrium
    image: tass-atrium:local
    init: true
    depends_on:
      workspace:
        condition: service_healthy
    environment:
      TASS_ATRIUM_BACKEND_URL: http://workspace:8790
      TASS_ATRIUM_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8791:8791"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/bridge/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Owner-activated ONLY. Reads the Workshop event record and queues bounded
  # evidence through Identity Liaison into the owner's private TASS issue.
  # The observer has no GitHub token, Jupyter privileges, or network.
  collab-feed:
    profiles: ["collaboration"]
    build:
      context: ./collab_feed
    image: tass-collab-feed:local
    init: true
    command: ["--issue", "${TASS_COLLAB_ISSUE:-19}", "--data", "/workspace/data",
              "--outbox", "/shared/outbox", "--state", "/collab/state"]
    environment:
      TASS_COLLAB_INCLUDE_TEXT: ${TASS_COLLAB_INCLUDE_TEXT:-0}
    user: "${TASS_UID:-1000}:${TASS_GID:-1000}"
    network_mode: "none"
    read_only: true
    volumes:
      - ./data:/workspace/data:ro
      - ./outbox:/shared/outbox
      - ./collab_state:/collab/state
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
