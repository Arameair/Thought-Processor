<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><title>TASS Cognition UX concept</title><rect x="0" y="0" width="1600" height="950" rx="0" fill="#0b1221" stroke="#0b1221" stroke-width="1"/><rect x="0" y="0" width="1600" height="78" rx="0" fill="#0e172b" stroke="#0e172b" stroke-width="1"/><text x="32" y="52" fill="#78e2ee" font-size="34" font-family="Arial,Segoe UI,sans-serif" font-weight="800">✦  TASS</text><text x="275" y="49" fill="#8e9cba" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Workstation</text><rect x="423" y="18" width="168" height="44" rx="13" fill="#3d2c69" stroke="#6953ac" stroke-width="1"/><text x="452" y="46" fill="#ffffff" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Cognition</text><text x="628" y="48" fill="#90a3c6" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Development</text><text x="855" y="48" fill="#90a3c6" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Identity</text><rect x="1342" y="22" width="218" height="31" rx="15" fill="#26324e" stroke="#26324e" stroke-width="1"/><text x="1355" y="43" fill="#d7e7ff" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="700">CONCEPT — NOT LIVE</text><rect x="0" y="78" width="204" height="872" rx="0" fill="#10192b" stroke="#1c2944" stroke-width="1"/><text x="26" y="125" fill="#8798b8" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="700">WORKSPACES</text><text x="27" y="178" fill="#f5eeff" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="700">▣  Cognition</text><text x="27" y="227" fill="#97a8c4" font-size="19" font-family="Arial,Segoe UI,sans-serif" font-weight="500">□  Development</text><text x="27" y="277" fill="#97a8c4" font-size="19" font-family="Arial,Segoe UI,sans-serif" font-weight="500">◫  Lessons</text><text x="27" y="325" fill="#97a8c4" font-size="19" font-family="Arial,Segoe UI,sans-serif" font-weight="500">♙  Identity</text><rect x="17" y="747" width="170" height="164" rx="12" fill="#182944" stroke="#344763" stroke-width="1"/><text x="32" y="783" fill="#d5e8f4" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="700">TASS status</text><rect x="30" y="801" width="124" height="31" rx="15" fill="#394962" stroke="#394962" stroke-width="1"/><text x="43" y="822" fill="#f1db8b" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="700">PAUSED</text><text x="31" y="862" fill="#9baccb" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">20-second pulse</text><text x="31" y="890" fill="#b4c3db" font-size="14" font-family="Arial,Segoe UI,sans-serif" font-weight="500">No live feed active</text><text x="231" y="125" fill="#95d7e8" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="500">← Back to Thought Shelf</text><text x="230" y="178" fill="#f7f8ff" font-size="36" font-family="Arial,Segoe UI,sans-serif" font-weight="800">identity-test</text><rect x="488" y="143" width="140" height="31" rx="15" fill="#2b4b69" stroke="#2b4b69" stroke-width="1"/><text x="501" y="164" fill="#bce8ff" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="700">THOUGHT</text><text x="230" y="215" fill="#a8bcd5" font-size="19" font-family="Arial,Segoe UI,sans-serif" font-weight="500">What is the identity-test notebook skill's purpose?</text><text x="231" y="263" fill="#edf2ff" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Outputs &amp; history</text><text x="650" y="263" fill="#edf2ff" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Developed Note — what TASS produced</text><text x="1270" y="263" fill="#edf2ff" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Evidence</text><rect x="229" y="283" width="389" height="559" rx="17" fill="#17243b" stroke="#314761" stroke-width="1"/><rect x="243" y="302" width="361" height="97" rx="13" fill="#322a55" stroke="#6e5ab3" stroke-width="1"/><text x="262" y="334" fill="#ffffff" font-size="23" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Developed Note</text><text x="262" y="362" fill="#d1c6eb" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Selected persisted output</text><text x="262" y="387" fill="#93f4e2" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">View full text →</text><rect x="243" y="410" width="361" height="96" rx="13" fill="#1b2b45" stroke="#314a6c" stroke-width="1"/><text x="261" y="446" fill="#eff3fb" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Processing step</text><text x="261" y="476" fill="#aabdd4" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Recorded step (detail on selection)</text><rect x="243" y="517" width="361" height="96" rx="13" fill="#1b2b45" stroke="#314a6c" stroke-width="1"/><text x="261" y="553" fill="#eff3fb" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Nudge receipt</text><text x="261" y="583" fill="#aabdd4" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Source request and its final status</text><rect x="243" y="632" width="361" height="184" rx="13" fill="#121d31" stroke="#33435d" stroke-width="1"/><text x="264" y="670" fill="#e6f0ff" font-size="20" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Timeline</text><text x="262" y="710" fill="#b2c5df" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">1  Owner nudge submitted</text><text x="262" y="745" fill="#b2c5df" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">2  Model output saved</text><text x="262" y="780" fill="#b2c5df" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">3  Note linked to Thought</text><rect x="637" y="283" width="594" height="559" rx="17" fill="#18243e" stroke="#35506b" stroke-width="1"/><text x="664" y="329" fill="#f7f9ff" font-size="26" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Complete response</text><rect x="1040" y="296" width="164" height="31" rx="15" fill="#424663" stroke="#424663" stroke-width="1"/><text x="1053" y="317" fill="#e4ddff" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="700">CONCEPT TEXT</text><rect x="656" y="350" width="557" height="237" rx="12" fill="#101b2d" stroke="#334a66" stroke-width="1"/><text x="681" y="396" fill="#e1e9fa" font-size="22" font-family="Arial,Segoe UI,sans-serif" font-weight="700">The full saved Note appears here</text><text x="681" y="437" fill="#abc1da" font-size="19" font-family="Arial,Segoe UI,sans-serif" font-weight="500">when the owner-authorized read succeeds.</text><text x="681" y="474" fill="#efcb84" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="500">This is not TASS's actual Note content.</text><text x="681" y="515" fill="#a4bbd3" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Keep original text intact and inspectable.</text><text x="663" y="629" fill="#f0f5fd" font-size="21" font-family="Arial,Segoe UI,sans-serif" font-weight="700">What happened?</text><text x="663" y="668" fill="#b6c9e2" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">A nudge led to a recorded developed Note.</text><text x="663" y="700" fill="#b6c9e2" font-size="17" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Persistence does not prove the answer was useful.</text><rect x="659" y="733" width="548" height="72" rx="12" fill="#236c71" stroke="#57bfc3" stroke-width="1"/><text x="703" y="777" fill="#f4ffff" font-size="21" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Investigate this output in Development →</text><rect x="1250" y="283" width="311" height="559" rx="17" fill="#17243b" stroke="#314761" stroke-width="1"/><text x="1271" y="333" fill="#f4f6ff" font-size="21" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Provenance</text><text x="1271" y="374" fill="#b7c9e2" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Source: existing Thought</text><text x="1271" y="408" fill="#b7c9e2" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Nudge / request: when recorded</text><text x="1271" y="441" fill="#eccb85" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Trace: NOT RECORDED if absent</text><text x="1271" y="490" fill="#f7fbff" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Run outcome</text><text x="1271" y="523" fill="#a9bed8" font-size="15" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Generated / persisted ≠ correct</text><text x="1271" y="565" fill="#f7fbff" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Team activity</text><text x="1271" y="598" fill="#a9bed8" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">Only show roles with real</text><text x="1271" y="625" fill="#a9bed8" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">recorded contributions.</text><rect x="1266" y="660" width="278" height="142" rx="13" fill="#1d3544" stroke="#486170" stroke-width="1"/><text x="1284" y="696" fill="#a7eee5" font-size="18" font-family="Arial,Segoe UI,sans-serif" font-weight="700">Owner controls</text><text x="1284" y="731" fill="#bbcadf" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">No model call on open.</text><text x="1284" y="763" fill="#bbcadf" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">No automatic workflow edit.</text><text x="234" y="919" fill="#8f9fb8" font-size="16" font-family="Arial,Segoe UI,sans-serif" font-weight="500">ILLUSTRATIVE CLICKED CARD. Preserved evidence and explicit authorization; no hidden thinking is fabricated.</text></svg>